[package]
name = "broadcastify"
version = "0.2.0"
edition = "2024"
description = "Uploads recorded calls to Broadcastify Calls."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-broadcastify"
homepage = "https://www.broadcastify.com/calls/"
authors = ["Luke Berndt <lukekb@gmail.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.12.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust TLS (rustls), so the release builds cross-compile.
ureq = "3"

[profile.release]
strip = true
lto = true


# Until trunk-recorder-plugin 0.12.0 (the `health` topic) is on crates.io.
[patch.crates-io]
trunk-recorder-plugin = { path = "../trunk-recorder-pro/crates/trunk-recorder-plugin" }
